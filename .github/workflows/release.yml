name: Build and Release Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Transform Manifest for Production
        run: |
          # Extract version from git tag (stripping the leading 'v')
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Building extension version: $VERSION"

          # Inject version, swap server URL, and strip localhost permissions
          python3 -c '
          import json, os
          version = os.environ["VERSION"]
          
          with open("manifest.json", "r") as f:
              data = json.load(f)
          
          data["version"] = version
          data["server_url"] = "https://krift.4eng.org"
          
          if "host_permissions" in data:
              data["host_permissions"] = [p for p in data["host_permissions"] if "127.0.0.1" not in p and "localhost" not in p]
          
          with open("manifest.json", "w") as f:
              json.dump(data, f, indent=2)
          '

      - name: Package Extension into Zip
        run: |
          zip -r extension-release.zip . -x "*.git*" "*.github*" "*.gitignore" "README.md"

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v1
        with:
          files: extension-release.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}