name: Build and Release Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Transform Files for Production
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Strip the leading 'v' from the tag (e.g., v0.4.1 -> 0.4.1)
          export CLEAN_VERSION="${TAG_NAME#v}"
          echo "Building extension version: $CLEAN_VERSION"

          # Update manifest.json version and strip localhost host permissions
          python3 -c '
          import json, os
          version = os.environ["CLEAN_VERSION"]
          with open("manifest.json", "r") as f:
              data = json.load(f)
          data["version"] = version
          if "host_permissions" in data:
              data["host_permissions"] = [p for p in data["host_permissions"] if "127.0.0.1" not in p and "localhost" not in p]
          with open("manifest.json", "w") as f:
              json.dump(data, f, indent=2)
          '

      - name: Switch Config for Production
        run: |
          echo 'const SERVER_URL = "https://krift.4eng.org";' > config.js

      - name: Package Extension into Zip
        run: |
          zip -r extension-release.zip . -x "*.git*" "*.github*" "*.gitignore" "README.md"

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v1
        with:
          files: extension-release.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}